name: ai-commerce-copilot-production

x-app: &app
  image: ${COMMERCE_APP_IMAGE:?COMMERCE_APP_IMAGE is required}
  build:
    context: .
    dockerfile: Dockerfile.production
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  logging: &bounded-logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

x-runtime-environment: &runtime-environment
  APP_ENV: production
  DEMO_DATA_ENABLED: "false"
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  AUTH_SIGNING_KEY: ${AUTH_SIGNING_KEY:?AUTH_SIGNING_KEY is required}
  CREDENTIAL_ENCRYPTION_KEYS: ${CREDENTIAL_ENCRYPTION_KEYS:?CREDENTIAL_ENCRYPTION_KEYS is required}
  CREDENTIAL_ACTIVE_KEY_ID: ${CREDENTIAL_ACTIVE_KEY_ID:?CREDENTIAL_ACTIVE_KEY_ID is required}
  LLM_PROVIDER: ${LLM_PROVIDER:-offline}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
  DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-pro}
  DOUYIN_WEBHOOK_APPLICATIONS: ${DOUYIN_WEBHOOK_APPLICATIONS:-}
  TIKTOK_SHOP_WEBHOOK_APPLICATIONS: ${TIKTOK_SHOP_WEBHOOK_APPLICATIONS:-}

services:
  mysql:
    image: mysql:8.4.11@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-commerce}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *bounded-logging

  db-users:
    image: mysql:8.4.11@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE:-commerce}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_RUNTIME_USER: ${MYSQL_RUNTIME_USER:?MYSQL_RUNTIME_USER is required}
      MYSQL_RUNTIME_PASSWORD: ${MYSQL_RUNTIME_PASSWORD:?MYSQL_RUNTIME_PASSWORD is required}
      MYSQL_MIGRATION_USER: ${MYSQL_MIGRATION_USER:?MYSQL_MIGRATION_USER is required}
      MYSQL_MIGRATION_PASSWORD: ${MYSQL_MIGRATION_PASSWORD:?MYSQL_MIGRATION_PASSWORD is required}
      MYSQL_BACKUP_USER: ${MYSQL_BACKUP_USER:?MYSQL_BACKUP_USER is required}
      MYSQL_BACKUP_PASSWORD: ${MYSQL_BACKUP_PASSWORD:?MYSQL_BACKUP_PASSWORD is required}
      MYSQL_RESTORE_USER: ${MYSQL_RESTORE_USER:?MYSQL_RESTORE_USER is required}
      MYSQL_RESTORE_PASSWORD: ${MYSQL_RESTORE_PASSWORD:?MYSQL_RESTORE_PASSWORD is required}
    volumes:
      - ./scripts/configure_mysql_roles.sh:/usr/local/bin/configure_mysql_roles.sh:ro
    depends_on:
      mysql:
        condition: service_healthy
    entrypoint: ["sh", "/usr/local/bin/configure_mysql_roles.sh"]
    restart: "no"
    read_only: true
    security_opt:
      - no-new-privileges:true
    logging: *bounded-logging

  migrate:
    <<: *app
    environment:
      <<: *runtime-environment
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?MIGRATION_DATABASE_URL is required}
    depends_on:
      db-users:
        condition: service_completed_successfully
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  agent-api:
    <<: *app
    environment: *runtime-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["uvicorn", "commerce.agent_api:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  frontend-v2:
    <<: *app
    environment:
      APP_ENV: production
      AGENT_API_URL: http://agent-api:8000
      PYTHONPATH: /app
    depends_on:
      agent-api:
        condition: service_healthy
    command: ["python", "-m", "streamlit", "run", "frontend/v2_streamlit_app.py", "--server.address=0.0.0.0", "--server.port=8511", "--server.headless=true"]
    expose:
      - "8511"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8511/_stcore/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  reverse-proxy:
    image: nginxinc/nginx-unprivileged:1.29-alpine@sha256:0c79d56aee561a1d81c63f00eee5fb5fe29279560cdc55e91425133104c7fbe6
    environment:
      NGINX_ENVSUBST_FILTER: ^(PUBLIC_HOSTNAME|PUBLIC_HTTPS_PORT)$
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:?PUBLIC_HOSTNAME is required}
      PUBLIC_HTTPS_PORT: ${COMMERCE_PUBLIC_HTTPS_PORT:-443}
    depends_on:
      agent-api:
        condition: service_healthy
      frontend-v2:
        condition: service_healthy
    ports:
      - "${COMMERCE_HTTP_BIND:-0.0.0.0}:${COMMERCE_HTTP_PORT:-8080}:8080"
      - "${COMMERCE_HTTPS_BIND:-0.0.0.0}:${COMMERCE_HTTPS_PORT:-8443}:8443"
    volumes:
      - ./deploy/nginx/commerce.conf.template:/etc/nginx/templates/default.conf.template:ro
      - type: bind
        source: ${TLS_CERT_FILE:?TLS_CERT_FILE is required}
        target: /etc/nginx/tls/fullchain.pem
        read_only: true
      - type: bind
        source: ${TLS_KEY_FILE:?TLS_KEY_FILE is required}
        target: /etc/nginx/tls/privkey.pem
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate --header=\"Host: $$PUBLIC_HOSTNAME\" -qO- https://127.0.0.1:8443/health/live | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /etc/nginx/conf.d:size=1m,mode=0755,uid=101,gid=101
      - /var/cache/nginx:size=32m,mode=0755,uid=101,gid=101
      - /var/run:size=1m,mode=0755,uid=101,gid=101
    security_opt:
      - no-new-privileges:true
    logging: *bounded-logging

  backup:
    image: mysql:8.4.11@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    profiles: ["maintenance"]
    user: "${BACKUP_UID:-0}:${BACKUP_GID:-0}"
    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE:-commerce}
      MYSQL_USER: ${MYSQL_BACKUP_USER:?MYSQL_BACKUP_USER is required}
      MYSQL_PASSWORD: ${MYSQL_BACKUP_PASSWORD:?MYSQL_BACKUP_PASSWORD is required}
      BACKUP_NAME: ${BACKUP_NAME:-}
    volumes:
      - type: bind
        source: ${BACKUP_DIRECTORY:-./backups}
        target: /backups
      - ./scripts/mysql_backup.sh:/usr/local/bin/mysql_backup.sh:ro
    depends_on:
      mysql:
        condition: service_healthy
    entrypoint: ["sh", "/usr/local/bin/mysql_backup.sh"]
    restart: "no"
    security_opt:
      - no-new-privileges:true
    logging: *bounded-logging

  restore:
    image: mysql:8.4.11@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    profiles: ["maintenance"]
    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE:-commerce}
      MYSQL_USER: ${MYSQL_RESTORE_USER:?MYSQL_RESTORE_USER is required}
      MYSQL_PASSWORD: ${MYSQL_RESTORE_PASSWORD:?MYSQL_RESTORE_PASSWORD is required}
      EXPECTED_SCHEMA_HEAD: ${EXPECTED_SCHEMA_HEAD:-0016_agent_workflow}
      EXPECTED_BACKUP_MANIFEST_SHA256: ${EXPECTED_BACKUP_MANIFEST_SHA256:-}
      RESTORE_BACKUP_FILE: ${RESTORE_BACKUP_FILE:-}
      RESTORE_CONFIRM: ${RESTORE_CONFIRM:-}
    volumes:
      - type: bind
        source: ${BACKUP_DIRECTORY:-./backups}
        target: /backups
        read_only: true
      - ./scripts/mysql_restore.sh:/usr/local/bin/mysql_restore.sh:ro
    depends_on:
      mysql:
        condition: service_healthy
    entrypoint: ["sh", "/usr/local/bin/mysql_restore.sh"]
    restart: "no"
    security_opt:
      - no-new-privileges:true
    logging: *bounded-logging

volumes:
  mysql-data:
