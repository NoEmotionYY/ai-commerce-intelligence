name: V2 Release Candidate Security

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v2-rc-*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-rc-security-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  secret-sast-dependencies:
    name: Secrets, SAST, and dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out full history for secret scanning
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan committed history and working tree for secrets
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_SUMMARY: "true"
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned scanners
        run: python -m pip install bandit==1.9.4 pip-audit==2.10.1
      - name: High-severity/high-confidence SAST gate
        run: >-
          bandit -r commerce frontend scripts
          -x tests -lll -iii
          -f json -o bandit-blocking.json
      - name: Record complete SAST findings for release review
        if: always()
        run: >-
          bandit -r commerce frontend scripts
          -x tests --exit-zero
          -f json -o bandit-full.json
      - name: Audit locked production dependencies
        run: >-
          python -m pip_audit
          --requirement requirements.production.lock
          --strict --no-deps --disable-pip
          --format json --output pip-audit.json
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-security-reports
          path: |
            bandit-blocking.json
            bandit-full.json
            pip-audit.json
          if-no-files-found: warn
          retention-days: 30

  container-vulnerability-scan:
    name: Production image vulnerability scan
    needs: secret-sast-dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out frozen source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build the exact scan target once
        run: >-
          docker build
          --file Dockerfile.production
          --label org.opencontainers.image.revision=${{ github.sha }}
          --tag commerce-v2-rc:${{ github.sha }}
          .
      - name: Block fixable Critical/High vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: commerce-v2-rc:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: "1"
      - name: Record complete Critical/High findings including unfixed
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: commerce-v2-rc:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"
      - name: Upload complete container report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-security-report
          path: trivy-results.sarif
          if-no-files-found: warn
          retention-days: 30
      - name: Export the scanned release image without rebuilding
        if: >-
          success() &&
          (github.event_name == 'workflow_dispatch' ||
          github.ref == 'refs/heads/main' ||
          startsWith(github.ref, 'refs/tags/v2-rc-'))
        run: |
          docker image inspect --format '{{.Id}}' "commerce-v2-rc:${GITHUB_SHA}" > production-image-id.txt
          printf '%s\n' "${GITHUB_SHA}" > production-source-revision.txt
          docker save "commerce-v2-rc:${GITHUB_SHA}" | gzip --best > commerce-v2-rc-image.tar.gz
          sha256sum commerce-v2-rc-image.tar.gz > commerce-v2-rc-image.tar.gz.sha256
      - name: Upload the exact scanned release image
        if: >-
          success() &&
          (github.event_name == 'workflow_dispatch' ||
          github.ref == 'refs/heads/main' ||
          startsWith(github.ref, 'refs/tags/v2-rc-'))
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-image-${{ github.sha }}
          path: |
            commerce-v2-rc-image.tar.gz
            commerce-v2-rc-image.tar.gz.sha256
            production-image-id.txt
            production-source-revision.txt
          if-no-files-found: error
          retention-days: 7
      - name: Remove only this job's image tag
        if: always()
        run: docker image rm --force commerce-v2-rc:${{ github.sha }}
