name: V2 Release Candidate

on:
  pull_request:
  push:
    branches: [master]
    tags: ["v2-rc-*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-rc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  quality:
    name: Quality / Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out frozen source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies on supported Python floor
        if: matrix.python-version == '3.11'
        run: python -m pip install -c requirements.ci.lock -e ".[dev]"
      - name: Install production-locked dependencies on release Python
        if: matrix.python-version == '3.12'
        run: >-
          python -m pip install
          -c requirements.production.lock -c requirements.ci.lock
          -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Format contract
        run: python -m ruff format --check .
      - name: Strict typing
        if: matrix.python-version == '3.12'
        run: python scripts/verify_types.py
      - name: Single Alembic head
        run: python scripts/verify_release_metadata.py
      - name: Full default regression with explicit skip report
        run: >-
          python -m pytest -q
          --junitxml=test-results-${{ matrix.python-version }}.xml
          --cov=commerce --cov=frontend
          --cov-report=term --cov-report=xml:coverage-${{ matrix.python-version }}.xml
      - name: Reject skips outside the reviewed E2E allowlist
        run: python scripts/verify_pytest_skips.py test-results-${{ matrix.python-version }}.xml
      - name: Record environment-gated exclusions
        if: always()
        run: |
          {
            echo "### Environment-gated tests"
            echo "DeepSeek, real Douyin/TikTok seller credentials, legacy Compose, and UI E2E are not enabled in the default job."
            echo "Any pytest skip is reported in JUnit and is not represented as PASS."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test and coverage baseline
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-python-${{ matrix.python-version }}
          path: |
            test-results-${{ matrix.python-version }}.xml
            coverage-${{ matrix.python-version }}.xml
          if-no-files-found: error
          retention-days: 14
      - name: Whitespace gate
        run: git diff --check

  mysql-migration-integrity:
    name: MySQL 8.4 migration integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4.11@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
        env:
          MYSQL_ROOT_PASSWORD: rc-ci-isolated-root-password
          MYSQL_DATABASE: commerce_ci_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prc-ci-isolated-root-password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      TEST_MYSQL_URL: mysql+pymysql://root:rc-ci-isolated-root-password@127.0.0.1:3306/commerce_ci_test
    steps:
      - name: Check out frozen source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: >-
          python -m pip install
          -c requirements.production.lock -c requirements.ci.lock
          -e ".[dev]"
      - name: Verify migration and MySQL integrity gates
        run: python scripts/verify_mysql_migrations.py

  production-contract-image:
    name: Production Compose and image contract
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out frozen source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: >-
          python -m pip install
          -c requirements.production.lock -c requirements.ci.lock
          -e ".[dev]"
      - name: Verify production contracts
        run: >-
          python -m pytest -q
          tests/unit/test_deployment_health.py
          tests/unit/test_production_deployment_contract.py
          tests/unit/test_rc_ci_contract.py
      - name: Render Compose, build once, and inspect runtime boundary
        run: python scripts/verify_production_image_contract.py

  production-release-smoke:
    name: Isolated production release smoke
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/master' ||
      startsWith(github.ref, 'refs/tags/v2-rc-')
    needs: [quality, mysql-migration-integrity, production-contract-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out frozen source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: >-
          python -m pip install
          -c requirements.production.lock -c requirements.ci.lock
          -e ".[dev]"
      - name: Install Chromium runtime
        run: python -m playwright install --with-deps chromium
      - name: Verify isolated production deployment and recovery
        run: python scripts/verify_production_deployment.py
